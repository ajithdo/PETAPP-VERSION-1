<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PawSetu redesign boards</title>
<link rel="stylesheet" href="icons.css">
<link rel="stylesheet" href="toran.css">
<style>
  html,body{background:#1F140E}
  body{color:#FBF2E3;margin:0;--ink:#FBF2E3;--ink-2:#D7C3AC}
  .board{padding:72px 80px 88px;position:relative;overflow:hidden;width:max-content;min-width:100%}
  .board:before,.board:after{content:"";position:absolute;right:-140px;top:-520px;width:900px;height:1100px;border:1.5px solid rgba(251,242,227,.06);border-radius:450px 450px 0 0;pointer-events:none}
  .board:after{right:-20px;top:-420px;width:660px;height:900px;border-radius:330px 330px 0 0}
  .bhead{display:flex;align-items:flex-end;justify-content:space-between;gap:48px;margin-bottom:56px;position:relative;z-index:1}
  .bhead .brand{font-size:22px;color:#FBF2E3;margin-bottom:22px}
  .bhead .brand svg{width:36px;height:36px}
  .bhead h1{font-size:64px;line-height:1;font-weight:780;font-stretch:78%;letter-spacing:-.02em;margin:0;max-width:1100px}
  .bhead p{font-size:19px;line-height:1.45;color:#D7C3AC;max-width:560px;margin:0}
  .frames{display:flex;gap:44px;align-items:flex-start;position:relative;z-index:1}
  .frames.wrap2{display:grid;grid-template-columns:repeat(2,max-content);gap:52px 44px}
  .frame{flex:none}
  .shot{border-radius:30px;overflow:hidden;box-shadow:0 0 0 1px rgba(251,242,227,.1),0 40px 80px -30px #000;background:#FBF7F1;position:relative}
  .shot img{display:block;width:100%}
  .shot.desk{border-radius:16px}
  .shot.cut:after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to bottom,rgba(31,20,14,0),#1F140E 92%)}
  .shot.cut{border-bottom-left-radius:0;border-bottom-right-radius:0;box-shadow:0 0 0 1px rgba(251,242,227,.1)}
  .cap{margin-top:18px;max-width:100%}
  .cap b{display:block;font-size:17px;font-weight:660}
  .cap span{display:block;font-size:14px;line-height:1.4;color:#D7C3AC;margin-top:3px}
  .rowlabel{font-size:15px;font-weight:660;color:#F8A80C;margin:0 0 16px;position:relative;z-index:1}
  /* overview */
  .ov{display:grid;grid-template-columns:780px max-content;gap:72px;align-items:start;position:relative;z-index:1}
  .ov h1{font-size:104px;line-height:.94;font-weight:800;font-stretch:76%;letter-spacing:-.025em;margin:26px 0 0}
  .ov .lede{font-size:22px;line-height:1.45;color:#D7C3AC;margin:28px 0 0;max-width:680px}
  .idea{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;padding:24px 0;border-top:1px solid #4A3426}
  .idea h3{font-size:24px;font-weight:740;font-stretch:84%;margin:0 0 4px}
  .idea p{font-size:16px;line-height:1.45;color:#D7C3AC;margin:0}
  .idea .vis{display:flex;align-items:center;justify-content:center;gap:10px}
  .sw{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:8px}
  .sw div{border-radius:16px;padding:54px 12px 12px;font-size:13px;line-height:1.3;font-weight:600}
  .sw small{display:block;font-weight:420;opacity:.8}
  .spec{font-size:40px;line-height:1.15;font-weight:760;font-stretch:80%}
  .spec.te,.spec.hi{font-stretch:88%;font-weight:700;font-size:34px;line-height:1.4}
</style>
</head>
<body>
<script src="kit.js"></script>
<script src="screens-info.js"></script>
<script src="boards.js"></script>
</body>
</html>
