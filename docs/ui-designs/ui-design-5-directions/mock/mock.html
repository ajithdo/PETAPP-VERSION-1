*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.indic{line-height:1.6}
.i{font-family:var(--icons);font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;flex:none}
.i.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--head);font-weight:var(--headw);letter-spacing:var(--headls)}
h1{font-size:26px;line-height:1.25}
h2{font-size:20px;line-height:1.3}
h3{font-size:17px;line-height:1.35}
body.indic h1{line-height:1.45}body.indic h2,body.indic h3{line-height:1.5}
.s{font-size:14px;color:var(--ink2)}
.m{font-size:15px;color:var(--ink2)}
.lbl{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink2)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.nowrap{white-space:nowrap}

/* App frame */
.app{min-height:100vh;display:flex;font-family:var(--body);color:var(--ink);background:var(--bg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:16px 16px 112px;display:flex;flex-direction:column;gap:var(--gap)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;background:var(--topbg);color:var(--topink);position:sticky;top:0;z-index:5;border-bottom:var(--topline)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:700;font-size:20px}
.logo .mark{width:34px;height:34px;border-radius:var(--rlogo);background:var(--brand);color:var(--onBrand);display:grid;place-items:center}
.logo .mark .i{font-size:22px}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;color:inherit}
.badge{position:absolute;top:8px;right:7px;min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:var(--onPrimary);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--body)}
.sos{height:40px;padding:0 14px;border-radius:20px;background:var(--sos);color:var(--onSos);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;letter-spacing:.04em}
.sos .i{font-size:20px}
.navbar{position:fixed;left:0;right:0;bottom:0;height:80px;background:var(--navbg);border-top:1px solid var(--hair);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px;z-index:6}
.navbar .t{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink2);width:20%}
.navbar .t .pill{width:60px;height:32px;border-radius:16px;display:grid;place-items:center}
.navbar .t.on{color:var(--ink)}
.navbar .t.on .pill{background:var(--tint);color:var(--onTint)}
.navbar .t.on .i{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.rail{width:256px;flex:none;background:var(--railbg);border-right:1px solid var(--hair);padding:16px 12px;display:flex;flex-direction:column;gap:4px;min-height:100vh;position:sticky;top:0}
.rail .logo{padding:6px 12px 18px}
.rail .t{height:52px;border-radius:var(--rnav);display:flex;align-items:center;gap:14px;padding:0 16px;font-weight:600;color:var(--ink2);font-size:16px}
.rail .t.on{background:var(--tint);color:var(--onTint)}
.rail .t.on .i{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.rail .sep{height:1px;background:var(--hair);margin:10px 12px}
.desk .top{padding:12px 32px;background:var(--bg);border-bottom:1px solid var(--hair)}
.desk .content{padding:28px 32px 48px;max-width:1180px;width:100%;margin:0 auto}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
.grid2>.col{gap:var(--gap)}

.card{background:var(--card);border-radius:var(--rcard);box-shadow:var(--shadow);border:var(--cardline);overflow:hidden}
.pad{padding:var(--cpad)}
.chips{display:flex;gap:8px;overflow:hidden}
.chip{height:40px;border-radius:var(--rchip);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px 0 4px;font-weight:600;font-size:15px;white-space:nowrap;background:var(--card)}
.chip img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.chip.on{background:var(--tint);color:var(--onTint);border-color:var(--onTint)}
.chip.add{padding:0 14px;color:var(--ink2)}
.btn{height:48px;border-radius:var(--rbtn);padding:0 20px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;font-family:var(--body)}
.btn.p{background:var(--primary);color:var(--onPrimary)}
.btn.o{border:1px solid var(--line);color:var(--ink);background:transparent}
.btn.t{color:var(--primary);padding:0 8px;height:48px}
.btn.full{width:100%}
.li{display:flex;align-items:center;gap:14px;padding:12px var(--cpad);min-height:64px}
.li+.li{border-top:1px solid var(--hair)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check.on .i{font-size:20px;color:var(--card)}
.done .ttl{color:var(--ink2)}
.ttl{font-weight:600;font-size:16px}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qa .q{background:var(--card);border-radius:var(--rcard);box-shadow:var(--shadow);border:var(--cardline);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:600;font-size:14px;line-height:1.3;min-height:104px}
.qa .q .ic{width:44px;height:44px;border-radius:var(--ric);display:grid;place-items:center;background:var(--tint);color:var(--onTint)}
.place{display:flex;gap:14px;padding:12px}
.place img{width:96px;height:96px;border-radius:var(--rimg);object-fit:cover;flex:none}
.stars{display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px}
.stars .i{font-size:18px;color:var(--ink)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec .btn.t{height:auto;padding:0}
.pillsm{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:700;background:var(--sunk);color:var(--ink)}
.pillsm.ok{background:var(--okTint);color:var(--ok)}
.pillsm.warn{background:var(--warnTint);color:var(--warn)}
.pillsm.pr{background:var(--tint);color:var(--onTint)}
.spark{display:block}
.tiles6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.desk .tiles6{grid-template-columns:repeat(6,minmax(0,1fr))}
.tile{background:var(--card);border-radius:var(--rcard);box-shadow:var(--shadow);border:var(--cardline);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px;text-align:center;line-height:1.3;min-height:96px}
.tile .i{color:var(--onTint);background:var(--tint);width:44px;height:44px;border-radius:var(--ric);display:grid;place-items:center}
.search{height:52px;border-radius:var(--rinput);border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ink2)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:700;color:var(--ink2);padding:10px 16px;border-bottom:1px solid var(--line);letter-spacing:.02em;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--hair);font-size:15px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi .v{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.1}
.sub{font-size:14px;color:var(--ink2)}
.demo{font-size:13px;font-weight:700;color:var(--ink2);border:1px dashed var(--line);border-radius:6px;padding:2px 6px}

/* ---------- Direction A: Deewar (wall calendar, ballpoint) ---------- */
.dA{--body:Hind,HindGuntur,sans-serif;--head:Hind,HindGuntur,sans-serif;--num:BarlowC,Hind,sans-serif;--icons:MSO;--headw:700;--headls:-.01em;
 --rcard:10px;--rbtn:10px;--rchip:10px;--rinput:10px;--rimg:6px;--ric:8px;--rnav:8px;--rlogo:8px;--shadow:none;--cardline:1px solid var(--hair);--gap:16px;--cpad:16px;--topbg:var(--card);--topink:var(--ink);--topline:1px solid var(--hair);--navbg:var(--card);--railbg:var(--card)}
.dA.te{--body:HindGuntur,Hind,sans-serif;--head:HindGuntur,Hind,sans-serif}
.cal{border-radius:var(--rcard);overflow:hidden;border:1px solid var(--hair);background:var(--card)}
.cal .band{background:var(--brand);color:var(--onBrand);padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline}
.cal .band .mo{font-family:var(--num);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.cal .days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:8px 6px 12px}
.cal .d{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.cal .d .w{font-size:13px;font-weight:600;color:var(--ink2)}
.cal .d .n{font-family:var(--num);font-weight:700;font-size:30px;line-height:1.15;position:relative;width:46px;height:42px;display:grid;place-items:center}
.cal .d .dot{width:7px;height:7px;border-radius:50%;background:var(--mark)}
.cal .d .dot.no{background:transparent}
.cal .d.sun .n{color:var(--ink)}
.ring{position:absolute;inset:-4px -6px;pointer-events:none}
.cal .legend{border-top:1px solid var(--hair);padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:15px}
.dateblk{width:64px;flex:none;text-align:center;position:relative}
.dateblk .n{font-family:var(--num);font-weight:700;font-size:38px;line-height:1;position:relative;display:inline-block;padding:6px 8px 4px}
.dateblk .w{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.time{font-family:var(--num);font-weight:600;font-size:22px;width:56px;flex:none;line-height:1}
.time small{display:block;font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px}
.pinno{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);font-family:var(--num);font-weight:700;display:grid;place-items:center;font-size:16px;flex:none}

/* ---------- Direction B: Muhar (vaccination booklet + rubber stamp) ---------- */
.dB{--body:NotoSansV,NotoDeva,NotoTel,sans-serif;--head:NotoSansV,NotoDeva,NotoTel,sans-serif;--num:NotoSansV,sans-serif;--icons:MSO;--headw:700;--headls:-.015em;
 --rcard:4px;--rbtn:4px;--rchip:4px;--rinput:4px;--rimg:2px;--ric:4px;--rnav:4px;--rlogo:4px;--shadow:none;--cardline:1px solid var(--line);--gap:14px;--cpad:14px;--topbg:var(--brand);--topink:var(--onBrand);--topline:none;--navbg:var(--card);--railbg:var(--card)}
.dB .i{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24}

.stamp{width:62px;height:62px;flex:none;position:relative;transform:rotate(-9deg);color:var(--mark)}
.stamp svg{position:absolute;inset:0}

.stamp.due{color:var(--ink2);transform:none}
.dB .num{font-stretch:87.5%;font-weight:700}
.dB .time{font-family:NotoSansV;font-stretch:87.5%;font-weight:700;font-size:17px;width:58px;flex:none}
.dB .time small{display:block;font-size:13px;font-weight:600;color:var(--ink2);font-stretch:100%}
.dB .qa .q,.dB .tile{border:1px solid var(--line)}
.dB .qa .q .ic,.dB .tile .i{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}

/* ---------- Direction C: Genda (marigold garland at home) ---------- */
.dC{--body:Hind,HindGuntur,sans-serif;--head:Baloo2,BalooTammudu2,sans-serif;--num:Baloo2,sans-serif;--icons:MSR;--headw:700;--headls:0;
 --rcard:22px;--rbtn:24px;--rchip:20px;--rinput:24px;--rimg:16px;--ric:50%;--rnav:24px;--rlogo:50%;--shadow:0 1px 2px rgba(60,35,0,.06),0 6px 18px rgba(60,35,0,.07);--cardline:none;--gap:18px;--cpad:18px;--topbg:var(--bg);--topink:var(--ink);--topline:none;--navbg:var(--card);--railbg:var(--sunk)}

.genda{background:var(--band);color:var(--onBand);border-radius:var(--rcard);padding:18px;display:flex;gap:18px;align-items:center}
.garland{width:140px;height:140px;flex:none;position:relative}
.garland img{position:absolute;left:26px;top:26px;width:88px;height:88px;border-radius:50%;object-fit:cover}
.garland svg{position:absolute;inset:0}
.genda .big{font-family:var(--head);font-weight:700;font-size:24px;line-height:1.2}
.genda .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:10px}
.genda .bar i{display:block;height:100%;width:50%;background:var(--brand);border-radius:5px}
.dC .time{font-family:var(--num);font-weight:700;font-size:17px;width:62px;flex:none}
.dC .time small{display:block;font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink2)}
.dC .check.on{background:var(--mark);border-color:var(--mark)}
.dC .check.on .i{color:#fff}
.dC.dark .check.on .i{color:var(--onBrand)}
.dC .rail .t.on{background:var(--ink);color:var(--card)}
.dC .navbar .t.on .pill{background:var(--ink);color:var(--card)}

/* Indic scripts: never letter-space or upper-case */
body.indic .lbl,body.indic .mo,body.indic .w,body.indic h1,body.indic h2,body.indic h3,body.indic .stamp .t{letter-spacing:0!important;text-transform:none!important}

.easy{font-size:19px}

.easy .li{min-height:76px}

function ringSvg(color,seed=0){
  // a hand-drawn ballpoint circle: two slightly offset loops
  const a=seed%2?1:-1;
  return `<svg class="ring" viewBox="0 0 60 50" preserveAspectRatio="none"><path d="M31 3c14 0 26 7 26 20s-12 23-28 23S3 37 3 24 16 2 34 4 c${9*a} 1 16 5 18 9" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/></svg>`;
}
function stampSvg(label,sub,due){
  const c='currentColor';
  return `<div class="stamp ${due?'due':''}"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="28" fill="none" stroke="${c}" stroke-width="${due?1.5:2.6}" ${due?'stroke-dasharray="4 4"':''}/>${due?'':`<circle cx="31" cy="31" r="23" fill="none" stroke="${c}" stroke-width="1.2" opacity=".85"/>`}</svg><div class="t"><span>${label}</span>${sub?`<span style="font-size:13px;font-weight:700">${sub}</span>`:''}</div></div>`;
}
function garlandSvg(done,total){
  let s='';const cx=70,cy=70,R=59;
  const n=16;
  for(let k=0;k<n;k++){
    const ang=-Math.PI/2+k*2*Math.PI/n; const x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang);
    const isTask=k%(n/total)===0; const ti=k/(n/total);
    if(isTask){
      const on=ti<done;
      s+=`<g transform="translate(${x} ${y})">${[0,1,2,3,4,5,6,7].map(j=>`<ellipse rx="4.4" ry="8.5" cy="-6.5" transform="rotate(${j*45})" fill="${on?'var(--brand)':'none'}" stroke="${on?'var(--brand)':'var(--onBand2)'}" stroke-width="1.5"/>`).join('')}<circle r="3.5" fill="${on?'#7A3E00':'var(--band)'}" stroke="${on?'var(--brand)':'var(--onBand2)'}" stroke-width="1.5"/></g>`;
    } else s+=`<circle cx="${x}" cy="${y}" r="3.2" fill="var(--brand)" opacity=".7"/>`;
  }
  return `<svg viewBox="0 0 140 140">${s}</svg>`;
}
